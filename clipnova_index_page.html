<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>ClipNova — terug van TikTok</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Poppins,sans-serif; color:#F4ECEE;
    background:radial-gradient(700px 420px at 15% -10%, rgba(122,23,48,.55), transparent 65%), #09070A;}
  main{max-width:560px; width:100%; margin:24px; padding:28px; border-radius:24px;
    background:#120D0F; border:1px solid #2C1B20;}
  .logo{font-weight:700; font-size:22px; letter-spacing:-.03em;}
  .logo span{color:#D2566F;}
  h1{font-size:24px; letter-spacing:-.02em; margin:18px 0 8px;}
  p{color:#B3A1A6; line-height:1.6; margin:0 0 16px;}
  textarea{width:100%; box-sizing:border-box; height:110px; padding:12px; border-radius:14px;
    background:#0D0A0C; color:#F4ECEE; border:1px solid #2C1B20; font:13px ui-monospace,monospace; resize:none;}
  button{margin-top:14px; width:100%; padding:16px; border:0; border-radius:999px; font:600 16px inherit;
    color:#FBEFF2; background:linear-gradient(135deg,#A3223F,#7A1730); cursor:pointer;}
  .ok{color:#8FCB9B; margin-top:12px; min-height:1.4em; font-size:14px;}
  .bad{color:#F08A7A;}
</style>
</head>
<body>
<main>
  <div class="logo">Clip<span>Nova</span>.</div>
  <h1 id="title">Bijna klaar</h1>
  <p id="msg">Kopieer deze link en plak hem in ClipNova bij Account → TikTok-concepten → Koppelen.</p>
  <textarea id="link" readonly></textarea>
  <button id="copy" type="button">Link kopiëren</button>
  <div class="ok" id="ok"></div>
</main>
<script>
  const link = location.href;
  const params = new URLSearchParams(location.search);
  document.getElementById('link').value = link;
  if(params.get('error')){
    document.getElementById('title').textContent = 'TikTok gaf geen toestemming';
    document.getElementById('msg').className = 'bad';
    document.getElementById('msg').textContent = 'Probeer opnieuw via ClipNova. Melding: ' + (params.get('error_description') || params.get('error'));
  } else if(!params.get('code')){
    document.getElementById('title').textContent = 'ClipNova';
    document.getElementById('msg').textContent = 'Deze pagina is alleen voor het terugkomen na inloggen bij TikTok.';
    document.getElementById('link').style.display = 'none';
    document.getElementById('copy').style.display = 'none';
  }
  document.getElementById('copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(link); }
    catch(e){ const t = document.getElementById('link'); t.select(); document.execCommand('copy'); }
    document.getElementById('ok').textContent = 'Gekopieerd. Plak hem nu in ClipNova.';
  };
</script>
</body>
</html>
